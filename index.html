/* Percent-encode everything except ad-platform macros. split() with a capture group puts macros at odd indices. */
function encodeKeepMacros(v) {
  return v.split(MACRO_RE).map((seg, i) => (i % 2 ? seg : encodeURIComponent(seg))).join('');

function stripMacros(s) { return (s || '').replace(/\{\{[^{}]*\}\}|\{[^{}]*\}/g, '').replace(/[\s_\-]+$/, ''); }

  if (!hasMacro(u)) return u;

  return UTM_KEYS.filter((k) => utm[k] && utm[k].trim()).map((k) => k + '=' + encodeKeepMacros(utm[k].trim()));

function buildUtmUrl(base, utm) {

function dailySeries(link) {
  const out = [];
  const r = rng(link.id * 9973);
  for (let d = HISTORY; d >= 0; d--) {
    const date = addDays(TODAY, -d);
    let clicks = 0;
    if (d <= link.age && !(link.status === 'paused' && d < 5)) {
      const wd = [0.9, 1.0, 1.02, 1.0, 1.04, 1.1, 0.96][date.getDay()];
      const ramp = link.age < 30 ? 0.55 + 0.45 * (1 - d / Math.max(link.age, 1)) : 1;
      const boost = /double11|d11/.test(link.slug) ? 1 + 0.5 * (1 - d / 21) : 1;
      clicks = Math.max(0, Math.round(link.daily * wd * ramp * boost * (0.82 + r() * 0.36)));
    }
    out.push({ date, clicks, unique: Math.round(clicks * (link.uniq + (r() - 0.5) * 0.05)) });
  }
  return out;
}
const SERIES_CACHE = {};

  return out;
}
function realAggregate(rows, links, from, to) {
  const slugs = new Set(links.map((l) => slugKey(l.slug)));
  const prevLen = Math.round((to - from) / 864e5) + 1;
  const f = ymd(from), t = ymd(to), pf = ymd(addDays(from, -prevLen)), pt = ymd(addDays(from, -1));
  const days = [], idx = {};
  for (let d = new Date(from); ymd(d) <= t; d = addDays(d, 1)) { idx[ymd(d)] = days.length; days.push({ date: new Date(d), label: md(d), total: 0, unique: 0, v: new Set() }); }
  const os = [0, 0, 0, 0, 0], br = [0, 0, 0, 0, 0, 0], ref = {}, camp = {}, ctry = {}, prevCamp = {}, all = new Set();
  let total = 0, prevTotal = 0, bots = 0, inapp = 0;
  const OSI = { ios: 0, android: 1, windows: 2, macos: 3 };
  (rows || []).forEach((r) => {

    const di = idx[k]; days[di].total++; days[di].v.add(r.visitor);
    os[r.os in OSI ? OSI[r.os] : 4]++;
    const bi = r.in_app === 'line' ? 0 : r.in_app === 'instagram' ? 1 : (r.in_app === 'facebook' || r.in_app === 'messenger') ? 2 : r.browser === 'Chrome' ? 3 : r.browser === 'Safari' ? 4 : 5;

}

function aggregate(links, from, to) {
  const prevLen = Math.round((to - from) / 864e5) + 1;
  const prevFrom = addDays(from, -prevLen), prevTo = addDays(from, -1);
  const days = [];
  for (let d = new Date(from); d <= to; d = addDays(d, 1)) days.push({ date: new Date(d), label: md(d), total: 0, unique: 0 });
  const os = [0, 0, 0, 0], br = [0, 0, 0, 0, 0, 0], ref = {}, campaigns = {}, geo = REGIONS.map(() => 0), ctry = COUNTRIES.map(() => 0);
  let total = 0, unique = 0, prevTotal = 0;
  links.forEach((l) => {
    const prof = PROFILES[l.profile];
    let lt = 0, lu = 0, lp = 0;
    seriesOf(l).forEach((p) => {
      if (p.date >= from && p.date <= addDays(to, 1) && ymd(p.date) <= ymd(to)) {
        const idx = Math.round((p.date - from) / 864e5);
        if (idx >= 0 && idx < days.length) { days[idx].total += p.clicks; days[idx].unique += p.unique; lt += p.clicks; lu += p.unique; }
      }
      if (ymd(p.date) >= ymd(prevFrom) && ymd(p.date) <= ymd(prevTo)) lp += p.clicks;
    });
    total += lt; unique += lu; prevTotal += lp;
    prof.os.forEach((w, i) => os[i] += lt * w);
    prof.br.forEach((w, i) => br[i] += lt * w);
    Object.entries(prof.ref).forEach(([k, w]) => ref[k] = (ref[k] || 0) + lt * w);
    REGIONS.forEach(([, w], i) => geo[i] += lt * w);
    COUNTRIES.forEach(([, w], i) => ctry[i] += lt * w);
    const cn = l.resolved || l.utm.utm_campaign;
    const c = campaigns[cn] || (campaigns[cn] = { name: cn, source: l.utm.utm_source, medium: l.utm.utm_medium, clicks: 0, unique: 0, prev: 0, inapp: 0 });
    c.clicks += lt; c.unique += lu; c.prev += lp; c.inapp += lt * INAPP_IDX.reduce((s, i) => s + prof.br[i], 0);
  });
  const inapp = INAPP_IDX.reduce((s, i) => s + br[i], 0);
  return { days, total, unique, prevTotal, inapp, bots: Math.round(total * 0.061), os, br, ref: Object.entries(ref).sort((a, b) => b[1] - a[1]), campaigns: Object.values(campaigns).sort((a, b) => b.clicks - a.clicks), geo, ctry,
    geoRows: REGIONS.map(([n], i) => [n, geo[i]]), ctryRows: COUNTRIES.map(([n], i) => [n, ctry[i]]) };
}

function qrSvg({ text, ec, fg, bg, logo, logoImg, logoLetter }) {
  const qr = qrcode(0, ec);
  qr.addData(text || ' ');
  qr.make();
  const n = qr.getModuleCount(), q = 4, size = n + q * 2;
  let d = '';

    let c = 0;
    while (c < n) {
      if (qr.isDark(r, c)) { let s = c; while (c < n && qr.isDark(r, c)) c++; d += `M${s + q} ${r + q}h${c - s}v1h${-(c - s)}z`; } else c++;
    }
  }
  let logoSvg = '';
  if (logo !== 'none') {
    const L = Math.round(n * 0.22), x = (size - L) / 2;
    logoSvg = `<rect x="${x - 0.8}" y="${x - 0.8}" width="${L + 1.6}" height="${L + 1.6}" rx="${L * 0.22}" fill="${bg}"/>`;
    if (logo === 'upload' && logoImg) logoSvg += `<image href="${logoImg}" x="${x}" y="${x}" width="${L}" height="${L}" preserveAspectRatio="xMidYMid meet"/>`;
    else logoSvg += `<rect x="${x}" y="${x}" width="${L}" height="${L}" rx="${L * 0.2}" fill="${fg}"/><text x="${size / 2}" y="${size / 2 + L * 0.2}" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-weight="700" font-size="${L * 0.6}" fill="${bg}">${logoLetter}</text>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="${bg}"/><path d="${d}" fill="${fg}"/>${logoSvg}</svg>`;
}
function luminance(hex) {
  const v = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));

}

    setUndo({ base, utm, activePreset, n: macroCount });
    setBase(stripMacrosUrl(base));
    setUtm(Object.fromEntries(UTM_KEYS.map((k) => [k, stripMacros(utm[k] || '')])));
    setActivePreset(null);
    notify('已清除 ' + macroCount + ' 個巨集');
  };
  const restoreMacros = () => { if (!undo) return; setBase(undo.base); setUtm(undo.utm); setActivePreset(undo.activePreset); setUndo(null); };
  const missing = ['utm_source', 'utm_medium', 'utm_campaign'].filter((k) => !utm[k] || !utm[k].trim());
  const lint = [];
  UTM_KEYS.forEach((k) => (utm[k] || '').split(MACRO_RE).forEach((seg, i) => {
    if (i % 2) return;
    if (/[A-Z]/.test(seg) && !lint.includes('uc')) lint.push('uc');
    if (/\s/.test(seg.trim()) && !lint.includes('sp')) lint.push('sp');
    if (/[^\x00-\x7F]/.test(seg) && !lint.includes('cjk')) lint.push('cjk');
  }));
  const baseOk = isLpurl || /^https?:\/\/[^\s]+\.[^\s]+/.test(base.trim());
  const canCreate = baseOk && !missing.length && !slugErr && !isLpurl && !saving;

  const create = () => {
    setSaving(true);
    setTimeout(() => {
      const l = { id: Date.now(), created: ymd(TODAY), createdAt: Date.now(), domain, slug, base, utm, dpa, status: 'active', age: 0, daily: 0, uniq: .7, profile: utm.utm_source === 'line' ? 'line' : utm.utm_source === 'google' ? 'google' : utm.utm_source === 'newsletter' ? 'newsletter' : utm.utm_source === 'instagram' ? 'instagram' : 'facebook', isNew: true };
      addLink(l); setCreated(l); setSaving(false); setAutoSlug(randomSlug()); setCustom('');
      notify('已建立 ' + domain + '/' + slug);
    }, 450);
  };
  const savePreset = () => {
    const name = presetName.trim(); if (!name) return;
    const p = { id: 'u' + Date.now(), name, dpa, utm: { ...utm } };
    setPresets([...presets, p]); setActivePreset(p.id); setPresetName(''); notify('範本已儲存：' + name);
  };

  const field = (k, label, ph, req) => (
    <div key={k}>
      <label className="label flex items-center gap-1" htmlFor={k}><span className="mono">{k}</span>{req && <span style={{ color: 'var(--bad)' }}>*</span>}<span className="font-normal"> · {label}</span></label>
      <input id={k} className={'input mono mt-1'} value={utm[k] || ''} placeholder={ph} onFocus={() => setFocusKey(k)} onChange={(e) => set(k, e.target.value)} spellCheck={false} autoComplete="off" />
    </div>
  );

  return (
    <div className="grid-create">
      <div className="grid gap-5 min-w-0">
        <section className="card p-5">
          <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
            <div>
              <h2 className="text-lg font-bold">1. 目的地與 UTM 參數</h2>
              <p className="text-[color:var(--muted)] text-[13px]">填入落地頁，系統自動組出帶參數的完整網址。</p>
            </div>
            <div className="seg" role="group" aria-label="模式">
              <button aria-pressed={!dpa} onClick={() => setDpa(false)}>標準模式</button>
              <button aria-pressed={dpa} onClick={() => setDpa(true)}>DPA 動態廣告</button>
            </div>
          </div>

          <div className="mb-4">
            <div className="label mb-2 flex items-center gap-1"><Icon name="Bookmark" size={13} />常用範本（一鍵套用）</div>
            <div className="flex flex-wrap gap-2">
              {presets.map((p) => <button key={p.id} className={'chip' + (activePreset === p.id ? ' on' : '')} onClick={() => applyPreset(p)}>{p.dpa && <Icon name="Zap" size={12} />}{p.name}</button>)}
            </div>
          </div>

          <label className="label" htmlFor="base">落地頁網址（Destination URL）</label>
          <input id="base" className="input mono mt-1 mb-1" value={base} onChange={(e) => setBase(e.target.value)} placeholder="https://www.brand.com/collections/…" spellCheck={false} />
          {!baseOk && base && <p className="text-xs" style={{ color: 'var(--bad)' }}>請輸入以 http:// 或 https:// 開頭的完整網址。</p>}
          {isLpurl && <p className="text-xs" style={{ color: 'var(--warn)' }}>偵測到 {'{lpurl}'}：這是 Google Ads 追蹤範本，直接貼到「追蹤範本」欄位即可，不需要縮網址。</p>}

          <div className="grid sm:grid-cols-2 gap-3 mt-4">
            {field('utm_source', '流量來源', 'facebook', true)}
            {field('utm_medium', '行銷媒介', 'paid_social', true)}
            {field('utm_campaign', '活動名稱', dpa ? '{{campaign.name}}' : 'double11_sale', true)}
            {field('utm_term', '關鍵字 / 受眾', dpa ? '{{adset.name}}' : 'running_shoes')}
            <div className="sm:col-span-2">{field('utm_content', '素材 / 商品', dpa ? '{{product.id}}' : 'banner_a')}</div>
          </div>

          {lint.length > 0 && (
            <div className="mt-3 text-xs grid gap-1" style={{ color: 'var(--warn)' }}>
              {lint.includes('uc') && <div className="flex gap-1 items-center"><Icon name="AlertTriangle" size={13} />含大寫：GA4 會把 Facebook 與 facebook 視為不同來源，建議統一小寫。</div>}
              {lint.includes('sp') && <div className="flex gap-1 items-center"><Icon name="AlertTriangle" size={13} />含空白：會被編碼成 %20，建議改用底線。</div>}
              {lint.includes('cjk') && <div className="flex gap-1 items-center"><Icon name="Info" size={13} />含中文：會被百分比編碼，報表仍可讀取，但網址會變長。</div>}
            </div>
          )}

          {!dpa && macroCount > 0 && (
            <div className="mt-3 rounded-lg p-3 flex flex-wrap items-center gap-2 text-[13px]" style={{ background: 'var(--warn-soft)', color: 'var(--warn)' }}>
              <Icon name="AlertTriangle" size={14} />
              <span>偵測到 {macroCount} 個巨集。標準模式的廣告不會替換它們，網址會留著大括號。</span>
              <button className="btn sm ml-auto" onClick={clearMacros}><Icon name="Eraser" size={14} />清除巨集</button>
            </div>
          )}
          {undo && (
            <div className="mt-3 rounded-lg px-3 py-2 flex items-center gap-2 text-[13px]" style={{ background: 'var(--surface2)' }}>
              <Icon name="Eraser" size={14} />已清除 {undo.n} 個巨集
              <button className="btn sm ml-auto" onClick={restoreMacros}>復原</button>
            </div>
          )}
          {dpa && (
            <div className="mt-4 rounded-lg p-3" style={{ background: 'var(--macro-soft)' }}>
              <div className="flex flex-wrap items-center gap-2 mb-2" style={{ color: 'var(--macro)' }}>
                <Icon name="Zap" size={14} /><span className="font-bold text-[13px]">DPA 巨集變數</span>
                <span className="text-xs">點擊插入到目前欄位（<span className="mono">{focusKey}</span>）。大括號不會被轉義成 %7B%7D。</span>
                <button className="btn sm ml-auto" onClick={clearMacros} disabled={!macroCount} style={{ color: 'var(--fg)' }}><Icon name="Eraser" size={14} />清除巨集{macroCount ? '（' + macroCount + '）' : ''}</button>
              </div>
              {Object.entries(MACROS).map(([g, arr]) => (
                <div key={g} className="flex flex-wrap items-center gap-1.5 mb-1.5">
                  <span className="label w-20 flex-none">{g}</span>
                  {arr.map((m) => <button key={m} className="chip macro" onClick={() => insertMacro(m)}>{m}</button>)}
                </div>
              ))}
            </div>
          )}

          <div className="mt-4 flex flex-wrap items-center gap-2 pt-4" style={{ borderTop: '1px solid var(--line)' }}>
            <input id="preset-name" className="input" style={{ maxWidth: 240 }} placeholder="範本名稱，例如 TikTok_DPA" value={presetName} onChange={(e) => setPresetName(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && savePreset()} />
            <button className="btn" onClick={savePreset} disabled={!presetName.trim()}><Icon name="Save" />儲存為範本</button>
          </div>
        </section>

        <section className="card p-5">
          <h2 className="text-lg font-bold mb-1">2. 短網址設定</h2>
          <p className="text-[color:var(--muted)] text-[13px] mb-4">選擇品牌網域，使用隨機短碼或自訂專屬後綴。</p>
          <div className="grid sm:grid-cols-[220px_minmax(0,1fr)] gap-4">
            <div>
              <label className="label" htmlFor="domain">品牌網域</label>
              <select id="domain" className="input mt-1" value={domain} onChange={(e) => setDomain(e.target.value)}>
                {activeDomains.map((d) => <option key={d.host} value={d.host}>{d.host}{d.isDefault ? '（預設）' : ''}</option>)}
              </select>
              <p className="text-xs mt-1 text-[color:var(--faint)]">僅列出 DNS 與 SSL 皆已啟用的網域。</p>
            </div>
            <div>
              <div className="label mb-1">短碼後綴</div>
              <div className="seg mb-2" role="group" aria-label="後綴模式">
                <button aria-pressed={slugMode === 'auto'} onClick={() => setSlugMode('auto')}>自動隨機</button>
                <button aria-pressed={slugMode === 'custom'} onClick={() => setSlugMode('custom')}>自訂後綴</button>
              </div>
              {slugMode === 'auto' ? (
                <div className="flex gap-2">
                  <div className="input mono flex items-center" aria-live="polite">{autoSlug}</div>
                  <button className="btn" onClick={() => setAutoSlug(randomSlug())} aria-label="重新產生"><Icon name="Shuffle" />重新產生</button>
                </div>
              ) : (
                <>
                  <input id="custom-slug" className="input mono" value={custom} onChange={(e) => setCustom(e.target.value)} placeholder="例如 養成水煮蛋肌 或 d11-sale" spellCheck={false} />
                  <p className="text-xs mt-1" style={{ color: slugErr ? 'var(--bad)' : custom ? 'var(--ok)' : 'var(--faint)' }}>{slugErr || (custom ? '可以使用' : '中文、英數、底線、連字號，2–50 字元，英文不分大小寫')}</p>
                </>
              )}
            </div>
          </div>
        </section>
      </div>

      <aside className="grid gap-5 sticky-col min-w-0">
        <section className="card p-4 grid gap-3">
          <div className="eyebrow">輸出結果</div>
          <div>
            <div className="label mb-1">完整網址（含 UTM）</div>
            {longUrl ? <ColoredUrl url={longUrl} /> : <div className="urlbox text-[color:var(--faint)]">請先填入落地頁網址</div>}
            <div className="mt-2 flex gap-2 flex-wrap items-center"><CopyBtn text={longUrl} notify={notify} />
              {hasMacro(longUrl) && <span className="pill" style={{ background: 'var(--macro-soft)', color: 'var(--macro)' }}>巨集 {'{ }'} 已原樣保留</span>}</div>
          </div>
          {dpa && (
            <div>
              <div className="label mb-1">URL 參數字串（貼到 Meta「網址參數」/ Google「Final URL suffix」）</div>
              <ColoredUrl url={params || '（尚無參數）'} />
              <div className="mt-2"><CopyBtn text={params} notify={notify} /></div>
            </div>
          )}
          {!isLpurl && (
            <div>
              <div className="label mb-1">{dpa && passThrough ? '短網址（投放用，帶巨集）' : '短網址'}</div>
              <div className="urlbox" style={{ fontSize: 13.5, fontWeight: 600 }}>
                {dpa && passThrough ? <ColoredUrl url={adShortUrl} /> : shortUrl}
              </div>
              {dpa && passThrough && <p className="text-xs mt-1.5 text-[color:var(--muted)]">廣告平台會替換 <span className="mono">?</span> 後的巨集；轉址時系統把這些參數合併進目的地網址。</p>}
              <div className="mt-2 flex gap-2 flex-wrap"><CopyBtn text={adShortUrl} notify={notify} label="複製短網址" />
                {slug && adShortEnc !== adShortUrl && <CopyBtn text={adShortEnc} notify={notify} label="複製編碼版" />}</div>
              {slug && hasNonAscii(slug) && <p className="text-xs mt-1.5 text-[color:var(--muted)]">中文短碼貼到 LINE 或廣告後台時，若連結被截斷，請改用「複製編碼版」。QR Code 已自動使用編碼版。</p>}
            </div>
          )}
          <button className="btn primary w-full" disabled={!canCreate} onClick={create}>
            {saving ? <Icon name="Loader2" className="spin" /> : <Icon name="Link2" />}{saving ? '建立中…' : '建立短網址'}
          </button>
          {!canCreate && !saving && (
            <p className="text-xs text-[color:var(--muted)]">
              {isLpurl ? '{lpurl} 追蹤範本不需要短網址。' : !baseOk ? '請輸入有效的落地頁網址。' : missing.length ? '還需填寫：' + missing.join('、') : slugErr}
            </p>
          )}
          {created && (
            <div className="rounded-lg p-3 flex items-start gap-2" style={{ background: 'var(--ok-soft)', color: 'var(--ok)' }}>
              <Icon name="CheckCircle2" size={16} style={{ marginTop: 2 }} />
              <div className="text-[13px]">已建立 <span className="mono font-medium">{created.domain}/{created.slug}</span>，可到「連結管理」查看。</div>
            </div>
          )}
        </section>
        {!isLpurl && <QRPanel url={adShortEnc} label={slug || 'link'} notify={notify} />}
      </aside>
    </div>
  );
}

/* ───────────────────────── Page 2: Links ───────────────────────── */
function LinksPage({ links, setLinks, domains, openAnalytics, notify, cloudRows }) {
  const [q, setQ] = useState('');
  const [fd, setFd] = useState('all');
  const [fs, setFs] = useState('all');
  const [sel, setSel] = useState(null);
  const range = [addDays(TODAY, -29), TODAY];
  const rows = useMemo(() => links.map((l) => {
    const s = REAL ? realSeries(l, cloudRows) : seriesOf(l); const last30 = s.slice(-30);
    const t7 = s.slice(-7).reduce((a, p) => a + p.clicks, 0);
    return { ...l, clicks: last30.reduce((a, p) => a + p.clicks, 0), unique: last30.reduce((a, p) => a + p.unique, 0), spark: s.slice(-14).map((p) => p.clicks), t7 };
  }).filter((l) => (fd === 'all' || l.domain === fd) && (fs === 'all' || l.status === fs) &&
    (!q || (l.domain + '/' + l.slug + l.utm.utm_campaign + l.base).toLowerCase().includes(q.toLowerCase()))), [links, q, fd, fs, cloudRows]);
  const selected = links.find((l) => l.id === sel);
  const toggle = (id) => setLinks(links.map((l) => l.id === id ? { ...l, status: l.status === 'active' ? 'paused' : 'active' } : l));
  const remove = (id) => { setLinks(links.filter((l) => l.id !== id)); setSel(null); notify('已刪除短網址'); };
  const [confirmDel, setConfirmDel] = useState(false);
  useEffect(() => setConfirmDel(false), [sel]);

  return (
    <div className="grid gap-4">
      <div className="flex flex-wrap items-center gap-3">
        <div className="relative flex-1" style={{ minWidth: 220, maxWidth: 420 }}>
          <Icon name="Search" size={15} style={{ position: 'absolute', left: 10, top: 11, color: 'var(--faint)' }} />
          <input id="link-search" className="input" style={{ paddingLeft: 32 }} placeholder="搜尋短碼、活動名稱或落地頁" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <select id="filter-domain" className="input" style={{ width: 170 }} value={fd} onChange={(e) => setFd(e.target.value)} aria-label="網域篩選">
          <option value="all">所有網域</option>{domains.filter((d) => d.ssl === 'active').map((d) => <option key={d.host}>{d.host}</option>)}
        </select>
        <select id="filter-status" className="input" style={{ width: 130 }} value={fs} onChange={(e) => setFs(e.target.value)} aria-label="狀態篩選">
          <option value="all">所有狀態</option><option value="active">啟用中</option><option value="paused">已暫停</option>
        </select>
        <span className="text-[color:var(--muted)] text-[13px] ml-auto">{rows.length} 筆 · 點擊數為近 30 天</span>
      </div>
      <div className="grid gap-4" style={{ gridTemplateColumns: selected ? 'minmax(0,1fr) minmax(0,380px)' : 'minmax(0,1fr)' }}>
        <div className="card scroll-x" style={{ minWidth: 0 }}>
          <table className="t" style={{ minWidth: 760 }}>
            <thead><tr><th>短網址</th><th>活動 / 來源</th><th style={{ textAlign: 'right' }}>總點擊</th><th style={{ textAlign: 'right' }}>不重複</th><th>近 14 天</th><th>狀態</th></tr></thead>
            <tbody>
              {rows.map((l) => (
                <tr key={l.id} className={'row' + (sel === l.id ? ' sel' : '')} onClick={() => setSel(l.id === sel ? null : l.id)}>
                  <td>
                    <div className="mono font-medium" style={{ fontSize: 13 }}>{l.domain}/<span style={{ color: 'var(--accent)' }}>{l.slug}</span></div>
                    <div className="text-xs text-[color:var(--faint)] mono truncate" style={{ maxWidth: 260 }}>{l.base.replace(/^https?:\/\//, '')}</div>
                  </td>
                  <td>
                    <div className="mono text-[12.5px]" style={{ maxWidth: 220, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{l.utm.utm_campaign}</div>
                    <div className="flex gap-1.5 mt-0.5"><span className="pill mute">{l.utm.utm_source}</span><span className="pill mute">{l.utm.utm_medium}</span>{l.dpa && <span className="pill" style={{ background: 'var(--macro-soft)', color: 'var(--macro)' }}>DPA</span>}</div>
                  </td>
                  <td className="num" style={{ textAlign: 'right', fontWeight: 600 }}>{fmt(l.clicks)}</td>
                  <td className="num" style={{ textAlign: 'right', color: 'var(--muted)' }}>{fmt(l.unique)}</td>
                  <td><Spark values={l.spark} /></td>
                  <td><StatusPill status={l.status} /></td>
                </tr>
              ))}
              {!rows.length && <tr><td colSpan={6} style={{ textAlign: 'center', padding: 40, color: 'var(--muted)' }}>{REAL && !links.length ? '還沒有短網址。到「建立短網址」新增第一條。' : '沒有符合條件的短網址'}</td></tr>}
            </tbody>
          </table>
        </div>
        {selected && <LinkDetail l={selected} onClose={() => setSel(null)} toggle={toggle} remove={remove} confirmDel={confirmDel} setConfirmDel={setConfirmDel} openAnalytics={openAnalytics} notify={notify} />}
      </div>
    </div>
  );
}
function LinkDetail({ l, onClose, toggle, remove, confirmDel, setConfirmDel, openAnalytics, notify }) {
  const longUrl = buildUtmUrl(l.base, l.utm);
  const pass = l.dpa ? buildPassThrough(l.utm) : '';
  const short = 'https://' + l.domain + '/' + l.slug + (pass ? '?' + pass : '');
  const shortEnc = 'https://' + l.domain + '/' + encodeURIComponent(l.slug) + (pass ? '?' + pass : '');
  const svg = useMemo(() => { try { return qrSvg({ text: shortEnc, ec: 'Q', fg: '#0b6b62', bg: '#ffffff', logo: 'builtin', logoLetter: (CFG.brandLetter || 'B') }); } catch (e) { return ''; } }, [shortEnc]);
  return (
    <div className="card p-4 grid gap-3 self-start min-w-0">
      <div className="flex items-start justify-between gap-2">
        <div className="min-w-0"><div className="eyebrow">連結詳情</div><div className="mono font-bold break-all">{l.domain}/{l.slug}</div></div>
        <button className="btn sm" onClick={onClose} aria-label="關閉"><Icon name="X" size={14} /></button>
      </div>
      <div className="flex gap-3 items-start">
        <div style={{ width: 96, flex: 'none', borderRadius: 6, overflow: 'hidden' }} dangerouslySetInnerHTML={{ __html: svg }} />
        <div className="grid gap-2 min-w-0">
          <StatusPill status={l.status} />
          <div className="flex gap-2 flex-wrap"><CopyBtn text={short} notify={notify} label="複製網址" />{shortEnc !== short && <CopyBtn text={shortEnc} notify={notify} label="編碼版" />}</div>
        </div>
      </div>
      <div><div className="label mb-1">完整目的地</div><ColoredUrl url={longUrl} /></div>
      <dl className="grid grid-cols-[auto_minmax(0,1fr)] gap-x-3 gap-y-1 text-[13px]">
        {UTM_KEYS.map((k) => l.utm[k] ? <React.Fragment key={k}><dt className="mono text-[color:var(--muted)]">{k}</dt><dd className="mono break-all">{hasMacro(l.utm[k]) ? <span style={{ color: 'var(--macro)' }}>{l.utm[k]}</span> : l.utm[k]}</dd></React.Fragment> : null)}
      </dl>
      <div className="grid grid-cols-2 gap-2">
        <button className="btn primary" onClick={() => openAnalytics(l.id)}><Icon name="BarChart3" />查看成效</button>
        <button className="btn" onClick={() => toggle(l.id)}><Icon name={l.status === 'active' ? 'Pause' : 'Play'} />{l.status === 'active' ? '暫停' : '啟用'}</button>
      </div>
      {!confirmDel ? <button className="btn sm" style={{ color: 'var(--bad)' }} onClick={() => setConfirmDel(true)}><Icon name="Trash2" size={14} />刪除</button>
        : <div className="flex items-center gap-2 text-[13px]"><span>刪除後短碼會失效，確定嗎？</span><button className="btn sm" style={{ background: 'var(--bad)', color: '#fff', borderColor: 'var(--bad)' }} onClick={() => remove(l.id)}>確定刪除</button><button className="btn sm" onClick={() => setConfirmDel(false)}>取消</button></div>}
    </div>
  );
}

/* ───────────────────────── Page 3: Analytics ───────────────────────── */
const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'];
function ChartTip({ active, payload, label, unit = '' }) {
  if (!active || !payload || !payload.length) return null;
  return (
    <div style={{ background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 8, padding: '8px 10px', boxShadow: '0 4px 16px rgba(0,0,0,.18)', fontSize: 12.5 }}>
      {label && <div className="mb-1" style={{ color: 'var(--muted)' }}>{label}</div>}
      {payload.map((p, i) => (

function Kpi({ label, value, sub, delta, icon }) {
  return (
    <div className="card p-4">

}
function DonutCard({ title, names, values, note }) {
  const total = values.reduce((a, b) => a + b, 0) || 1;
  const data = names.map((n, i) => ({ name: n, value: Math.round(values[i] || 0), fill: SERIES[i] })).filter((d) => d.value > 0);
  return (
    <div className="card p-4 min-w-0">
      <div className="font-bold mb-0.5">{title}</div>
      {note && <div className="text-xs text-[color:var(--muted)] mb-2">{note}</div>}

        <div style={{ width: 150, height: 150, flex: 'none' }}>
          <ResponsiveContainer width="100%" height="100%">
            <PieChart>
              <Pie data={data} dataKey="value" nameKey="name" innerRadius={44} outerRadius={72} paddingAngle={0} stroke="var(--surface)" strokeWidth={2} isAnimationActive={false}>
                {data.map((d, i) => <Cell key={i} fill={d.fill} />)}

            </PieChart>

        </div>
        <ul className="grid gap-1.5 flex-1 min-w-[150px]">

            <li key={n} className="flex items-center gap-2 text-[13px]"><span className="legend-dot" style={{ background: SERIES[i] }} /><span>{n}</span><span className="ml-auto num font-medium">{pct((values[i] || 0) / total)}</span></li>
          ))}
        </ul>
      </div>
    </div>
  );
}
function BarList({ rows, total, color = 'var(--s1)' }) {
  const max = Math.max(...rows.map((r) => r[1]), 1);
  return (
    <ul className="grid gap-2.5">
      {rows.map(([name, v]) => (
        <li key={name}>
          <div className="flex justify-between text-[13px] mb-1"><span className="truncate pr-2 mono" style={{ fontSize: 12.5 }}>{name}</span><span className="num flex-none"><b>{fmt(v)}</b> <span className="text-[color:var(--muted)]">{pct(v / total)}</span></span></div>
          <div style={{ background: 'var(--surface2)', borderRadius: 4 }}><div className="bar" style={{ width: (v / max * 100) + '%', background: color }} /></div>
        </li>
      ))}
    </ul>
  );
}

const DNS_META = { verified: ['ok', 'CheckCircle2', 'DNS 已指向'], pending: ['warn', 'Clock', 'DNS 等待中'], error: ['bad', 'AlertTriangle', 'DNS 錯誤'] };
const SSL_META = { active: ['ok', 'ShieldCheck', 'SSL 已啟用'], issuing: ['warn', 'Loader2', 'SSL 簽發中'], waiting: ['mute', 'Clock', '等待 DNS 驗證'] };
function DomainsPage({ domains, setDomains, links, notify }) {
  const [host, setHost] = useState('');
  const [open, setOpen] = useState('link.brand.com.tw');
  const [checking, setChecking] = useState(null);
  const valid = /^([a-z0-9-]+\.)+[a-z]{2,}$/i.test(host.trim());
  const dup = domains.some((d) => d.host === host.trim().toLowerCase());
  const apex = (h) => h.split('.').length <= 2 || /\.(com|org|net)\.[a-z]{2}$/.test(h) && h.split('.').length <= 3;
  const add = () => {
    const h = host.trim().toLowerCase();
    setDomains([...domains, { host: h, isDefault: false, dns: 'pending', ssl: 'waiting', cname: 'cname.waypoint.link', added: ymd(TODAY), fallback: 'https://www.brand.com' }]);
    setHost(''); setOpen(h); notify('已新增 ' + h + '，請設定 DNS');
  };
  const verify = (h) => {
    setChecking(h);
    setTimeout(() => {
      setDomains((ds) => ds.map((d) => d.host === h ? { ...d, dns: 'verified', ssl: 'issuing', found: undefined } : d));
      setChecking(null); notify('DNS 驗證成功，開始簽發 SSL 憑證');
      setTimeout(() => setDomains((ds) => ds.map((d) => d.host === h && d.ssl === 'issuing' ? { ...d, ssl: 'active' } : d)), 2600);
    }, 1400);
  };
  const setDefault = (h) => setDomains(domains.map((d) => ({ ...d, isDefault: d.host === h })));
  const steps = (d) => [['新增網域', true], ['設定 CNAME', d.dns === 'verified'], ['DNS 驗證', d.dns === 'verified'], ['簽發 SSL', d.ssl === 'active'], ['可用於短網址', d.dns === 'verified' && d.ssl === 'active']];

  return (
    <div className="grid gap-5">
      {REAL && <PagesGuide domains={domains} links={links} notify={notify} />}

        <p className="text-[13px] text-[color:var(--muted)] mb-3">建議使用子網域（例如 go.brand.com）。新增後依照下方指示在 DNS 服務商建立 CNAME。</p>
        <div className="flex flex-wrap gap-2">
          <input id="new-domain" className="input mono" style={{ maxWidth: 340 }} placeholder="go.yourbrand.com" value={host} onChange={(e) => setHost(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && valid && !dup && add()} spellCheck={false} />
          <button className="btn primary" disabled={!valid || dup} onClick={add}><Icon name="Plus" />新增網域</button>
        </div>
        {host && !valid && <p className="text-xs mt-1" style={{ color: 'var(--bad)' }}>網域格式不正確，例如 go.brand.com。</p>}
        {dup && <p className="text-xs mt-1" style={{ color: 'var(--bad)' }}>此網域已經存在。</p>}
      </section>)}

      {!REAL && (<div className="grid gap-3">
        {domains.map((d) => {
          const dm = DNS_META[d.dns], sm = SSL_META[d.ssl], isOpen = open === d.host;
          const count = links.filter((l) => l.domain === d.host).length;
          return (
            <section key={d.host} className="card">
              <button className="w-full flex flex-wrap items-center gap-x-4 gap-y-2 p-4 text-left" style={{ background: 'none', cursor: 'pointer' }} onClick={() => setOpen(isOpen ? null : d.host)} aria-expanded={isOpen}>
                <Icon name="Globe" size={18} style={{ color: 'var(--accent)' }} />
                <span className="mono font-bold">{d.host}</span>
                {d.isDefault && <span className="pill" style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}>預設網域</span>}
                <span className={'pill ' + dm[0]}><Icon name={dm[1]} size={13} />{dm[2]}</span>
                <span className={'pill ' + sm[0]}><Icon name={sm[1]} size={13} className={d.ssl === 'issuing' ? 'spin' : ''} />{sm[2]}</span>
                <span className="ml-auto text-[13px] text-[color:var(--muted)]">{count} 條短網址</span>
                <Icon name="ChevronRight" size={16} style={{ transform: isOpen ? 'rotate(90deg)' : 'none', transition: 'transform .15s' }} />
              </button>
              {isOpen && (
                <div className="p-4 pt-0 grid gap-4">
                  <ol className="flex flex-wrap gap-x-6 gap-y-2 text-[13px]">
                    {steps(d).map(([t, done], i) => <li key={t} className="flex items-center gap-1.5" style={{ color: done ? 'var(--ok)' : 'var(--muted)' }}><Icon name={done ? 'CheckCircle2' : 'Clock'} size={14} />{t}</li>)}
                  </ol>
                  <div className="scroll-x rounded-lg" style={{ border: '1px solid var(--line)' }}>
                    <table className="t" style={{ minWidth: 520 }}>
                      <thead><tr><th>類型</th><th>主機名稱（Name）</th><th>指向（Value）</th><th>TTL</th><th /></tr></thead>
                      <tbody>
                        <tr>
                          <td className="mono">{apex(d.host) ? 'ALIAS / ANAME' : 'CNAME'}</td>
                          <td className="mono">{d.host.split('.')[0]}</td>
                          <td className="mono">{d.cname}</td>
                          <td className="mono">3600</td>
                          <td><CopyBtn text={d.cname} notify={notify} /></td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  {apex(d.host) && <p className="text-xs" style={{ color: 'var(--warn)' }}>根網域不能使用 CNAME。請改用 ALIAS / ANAME，或建議改用子網域（如 go.{d.host}）。</p>}
                  {d.dns === 'pending' && d.found && (
                    <div className="rounded-lg p-3 text-[13px]" style={{ background: 'var(--warn-soft)', color: 'var(--warn)' }}>

                    </div>
                  )}
                  {d.dns === 'pending' && !d.found && <p className="text-[13px] text-[color:var(--muted)]">尚未偵測到記錄。DNS 變更通常 5 分鐘到 48 小時內生效。</p>}

                  {d.ssl === 'active' && <p className="text-[13px] text-[color:var(--muted)]">憑證由 Let's Encrypt 簽發並自動續期，到期前 30 天更新。強制 HTTPS 已開啟。</p>}
                  <div className="grid sm:grid-cols-[minmax(0,1fr)_auto] gap-3 items-end">
                    <div>
                      <label className="label" htmlFor={'fb-' + d.host}>找不到短碼時導向（Fallback URL）</label>
                      <input id={'fb-' + d.host} className="input mono mt-1" value={d.fallback} onChange={(e) => setDomains(domains.map((x) => x.host === d.host ? { ...x, fallback: e.target.value } : x))} />
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {d.dns !== 'verified' && <button className="btn primary" onClick={() => verify(d.host)} disabled={checking === d.host}>{checking === d.host ? <Icon name="Loader2" className="spin" /> : <Icon name="RefreshCw" />}{checking === d.host ? '檢查中…' : '驗證 DNS'}</button>}
                      {d.dns === 'verified' && d.ssl === 'active' && !d.isDefault && <button className="btn" onClick={() => setDefault(d.host)}>設為預設</button>}
                    </div>
                  </div>
                </div>
              )}
            </section>
          );
        })}
      </div>)}
    </div>
  );
}

          <li>把網域填進 <span className="mono">config.js</span> 的 <span className="mono">shortDomain</span>，重新上傳，這裡的短網址就會改用新網域。</li>
        </ol>
        <p className="text-xs mt-2 text-[color:var(--muted)]">一個 GitHub Pages 站台只能綁一個自訂網域。需要多個品牌網域時，每個網域各用一個 repo，或改用附贈的後端版本。</p>
      </div>
      <div className="flex gap-2 flex-wrap"><CopyBtn text={target} notify={notify} label={'複製 ' + target} /></div>
    </section>
  );
}

/* ───────────────────────── App shell ───────────────────────── */
/* ───────────────────────── Cloud (Google Apps Script) ───────────────────────── */
async function gas(url, body) {
  // 不帶自訂標頭，瀏覽器視為簡單請求（text/plain），不需要 CORS 預檢
  const r = await fetch(url, { method: 'POST', body: JSON.stringify(body) });
  if (!r.ok) throw new Error('伺服器回應 ' + r.status);
  return r.json();
}
const toCloud = (l) => ({
  slug: l.slug, domain: l.domain, destination: buildUtmUrl(l.base, l.utm), base: l.base,
  utm_source: l.utm.utm_source || '', utm_medium: l.utm.utm_medium || '', utm_campaign: l.utm.utm_campaign || '',
  utm_term: l.utm.utm_term || '', utm_content: l.utm.utm_content || '',
  dpa: !!l.dpa, forward_query: !!l.dpa, status: l.status || 'active', created: l.createdAt || 0,
});
const fromCloud = (r) => ({
  id: 'c-' + slugKey(r.slug), domain: r.domain, slug: String(r.slug), base: r.base,
  utm: { utm_source: r.utm_source || '', utm_medium: r.utm_medium || '', utm_campaign: r.utm_campaign || '', utm_term: r.utm_term || '', utm_content: r.utm_content || '' },
  dpa: !!r.dpa, status: r.status || 'active', createdAt: Number(r.created) || 0,
});
const presetOut = (p) => ({ id: p.id, name: p.name, dpa: !!p.dpa, utm: p.utm });
const sigOf = (ls, ps) => JSON.stringify([ls.map(toCloud), ps.map(presetOut)]);

function CloudPage({ url, setUrl, token, setToken, state, msg, connect, pushNow, reloadRows, autoSync, setAutoSync, links, rows, notify }) {
  const [show, setShow] = useState(false);
  const stateMeta = { off: ['mute', 'Cloud', '未連接'], loading: ['warn', 'Loader2', '連線中'], ok: ['ok', 'CheckCircle2', '已連接'], error: ['bad', 'AlertTriangle', '連線失敗'] }[state];
  const exportJson = () => JSON.stringify({ links: links.map(toCloud) }, null, 2);
  const copyCode = async () => {
    try { const r = await fetch('cloud/Code.gs'); if (!r.ok) throw new Error(); await navigator.clipboard.writeText(await r.text()); notify('已複製 Code.gs'); }
    catch (e) { notify('無法複製，請從 repo 的 cloud/Code.gs 開啟'); }
  };
  const dlJson = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([exportJson()], { type: 'application/json' })); a.download = 'links.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const recent = useMemo(() => rows.filter((r) => !r.bot).sort((a, b) => b.t - a.t).slice(0, 20), [rows]);
  return (
    <div className="grid gap-5">
      <section className="card p-5 grid gap-4">
        <div className="flex flex-wrap items-center gap-3">
          <h2 className="font-bold text-lg">連線設定</h2>
          <span className={'pill ' + stateMeta[0]}><Icon name={stateMeta[1]} size={13} className={state === 'loading' ? 'spin' : ''} />{stateMeta[2]}</span>
          {state === 'ok' && msg && <a className="text-[13px] underline" style={{ color: 'var(--accent)' }} href={msg} target="_blank" rel="noopener">開啟雲端試算表</a>}
        </div>
        {state === 'error' && <div className="rounded-lg p-3 text-[13px]" style={{ background: 'var(--bad-soft)', color: 'var(--bad)' }}>{msg}</div>}
        <div className="grid gap-3">
          <div>
            <label className="label" htmlFor="gas-url">Apps Script 網頁應用程式網址</label>
            <input id="gas-url" className="input mono mt-1" value={url} onChange={(e) => setUrl(e.target.value.trim())} placeholder="https://script.google.com/macros/s/…/exec" spellCheck={false} />
            <p className="text-xs mt-1 text-[color:var(--muted)]">轉址頁需要這個網址，請同時填進 config.js 的 appsScriptUrl，訪客的點擊才會被記錄。</p>
          </div>
          <div>
            <label className="label" htmlFor="gas-token">管理密碼</label>
            <div className="flex gap-2 mt-1">
              <input id="gas-token" className="input mono" type={show ? 'text' : 'password'} value={token} onChange={(e) => setToken(e.target.value.trim())} placeholder="執行 setup() 後在執行紀錄中取得" autoComplete="off" spellCheck={false} />
              <button className="btn" onClick={() => setShow(!show)}>{show ? '隱藏' : '顯示'}</button>
            </div>
            <p className="text-xs mt-1 text-[color:var(--muted)]">只會存在這個瀏覽器，不會上傳到 GitHub。</p>
          </div>
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <button className="btn primary" onClick={() => connect()} disabled={state === 'loading'}><Icon name="RefreshCw" size={15} />連線並同步</button>
          <button className="btn" onClick={() => pushNow(false)} disabled={state !== 'ok'}><Icon name="Upload" size={15} />立即儲存到雲端</button>
          <button className="btn" onClick={reloadRows} disabled={state !== 'ok'}><Icon name="Download" size={15} />重新載入點擊資料</button>
          <label className="flex items-center gap-2 text-[13px] ml-auto"><input id="autosync" type="checkbox" checked={autoSync} onChange={(e) => setAutoSync(e.target.checked)} />變更後自動儲存</label>
        </div>
      </section>

      <section className="card p-5 grid gap-3">
        <h2 className="font-bold text-lg">第一次設定（約 5 分鐘）</h2>
        <ol className="grid gap-2 text-[13.5px] list-decimal pl-5">
          <li>開啟 <a className="underline" style={{ color: 'var(--accent)' }} href="https://script.google.com/home/start" target="_blank" rel="noopener">script.google.com</a>，建立新專案。<button className="btn sm ml-2" onClick={copyCode}><Icon name="Copy" size={13} />複製 Code.gs</button> 後貼上，取代原本內容。</li>
          <li>函式選單選 <span className="mono">setup</span>，按「執行」並授權。執行紀錄會顯示<b>管理密碼</b>，試算表會自動建在你的雲端資料夾。</li>
          <li>部署 → 新增部署作業 → 網頁應用程式。執行身分「我」，誰可以存取「所有人」。複製網址。</li>
          <li>網址填進上方與 <span className="mono">config.js</span>，密碼填進上方，按「連線並同步」。</li>
        </ol>
      </section>

      <section className="card p-5 grid gap-3">
        <div>
          <h2 className="font-bold text-lg">加速轉址（選用）</h2>
          <p className="text-[13px] text-[color:var(--muted)]">新連結會立即從雲端查到，但雲端查詢比網站自己的檔案慢。把下面的內容存成 <span className="mono">links.json</span> 放進 repo，轉址會更快。</p>
        </div>
        <div className="flex gap-2 flex-wrap"><CopyBtn text={exportJson()} notify={notify} label="複製 links.json" /><button className="btn sm" onClick={dlJson}><Icon name="Download" size={14} />下載 links.json</button></div>
      </section>

      <section className="card scroll-x">
        <div className="p-4 pb-2 font-bold">最近 20 筆點擊</div>
        <table className="t" style={{ minWidth: 560 }}>
          <thead><tr><th>時間</th><th>短碼</th><th>來源</th><th>系統</th><th>瀏覽器</th></tr></thead>
          <tbody>
            {recent.map((r, i) => (
              <tr key={i}><td className="mono" style={{ fontSize: 12.5 }}>{r.t.toLocaleString('zh-TW', { hour12: false })}</td><td className="mono" style={{ fontSize: 12.5 }}>{r.slug}</td><td>{r.referer || '直接'}</td><td>{r.os}</td><td>{r.browser}</td></tr>
            ))}
            {!recent.length && <tr><td colSpan={5} style={{ textAlign: 'center', padding: 28, color: 'var(--muted)' }}>{state === 'ok' ? '還沒有點擊紀錄' : '連接雲端後會顯示'}</td></tr>}
          </tbody>
        </table>
      </section>
    </div>
  );
}

/* ───────────────────────── App shell ───────────────────────── */
const TABS_BASE = [['create', 'QrCode', '建立短網址'], ['links', 'Link2', '連結管理'], ['analytics', 'BarChart3', '成效分析'], ['domains', 'Globe', '網域設定']];
const TABS = REAL ? [...TABS_BASE, ['cloud', 'Cloud', '雲端儲存']] : TABS_BASE;
function siteHost() {
  if (CFG.shortDomain) return CFG.shortDomain;
  const h = location.host;
  if (h.endsWith('.github.io')) { const seg = location.pathname.split('/')[1]; if (seg && !seg.includes('.')) return h + '/' + seg; }
  return h;
}
function App() {
  const fromHash = () => { const h = location.hash.replace('#', ''); return TABS.some((t) => t[0] === h) ? h : 'create'; };
  const [tab, setTab] = useState(fromHash);
  const [links, setLinksState] = useState(() => (REAL ? LS.get('wp-links', []) : INITIAL_LINKS));
  const setLinks = (v) => setLinksState((prev) => { const next = typeof v === 'function' ? v(prev) : v; if (REAL) LS.set('wp-links', next); return next; });
  const [domains, setDomains] = useState(() => (REAL ? [{ host: siteHost(), isDefault: true, dns: 'verified', ssl: 'active', cname: '', added: ymd(TODAY), fallback: CFG.fallbackUrl || '' }] : INITIAL_DOMAINS));
  const [presets, setPresetsState] = useState(() => { try { const s = JSON.parse(localStorage.getItem('wp-presets') || 'null'); if (Array.isArray(s) && s.length) return s; } catch (e) {} return INITIAL_PRESETS; });
  const [linkId, setLinkId] = useState('all');
  const [toast, setToast] = useState('');
  const tRef = useRef();
  const notify = useCallback((m) => { setToast(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToast(''), 2600); }, []);
  const setPresets = (p) => { setPresetsState(p); try { localStorage.setItem('wp-presets', JSON.stringify(p)); } catch (e) {} };

  // ── 雲端
  const [cloudUrl, setCloudUrlS] = useState(() => LS.get('wp-cloud-url', '') || CFG.appsScriptUrl || '');
  const [cloudToken, setCloudTokenS] = useState(() => LS.get('wp-cloud-token', ''));
  const [autoSync, setAutoSyncS] = useState(() => LS.get('wp-autosync', true));
  const [cloudState, setCloudState] = useState('off');
  const [cloudMsg, setCloudMsg] = useState('');
  const [rows, setRows] = useState([]);
  const loaded = useRef(false), lastSig = useRef('');
  const linksRef = useRef(links), presetsRef = useRef(presets);
  linksRef.current = links; presetsRef.current = presets;
  const setCloudUrl = (v) => { setCloudUrlS(v); LS.set('wp-cloud-url', v); };
  const setCloudToken = (v) => { setCloudTokenS(v); LS.set('wp-cloud-token', v); };
  const setAutoSync = (v) => { setAutoSyncS(v); LS.set('wp-autosync', v); };

  const reloadRows = useCallback(async (u = cloudUrl, t = cloudToken) => {
    try { const c = await gas(u, { action: 'clicks', token: t, days: 90 }); if (!c.ok) throw new Error(c.error || '讀取失敗'); setRows(parseClickRows(c.cols, c.rows || [])); if (c.truncated) notify('點擊資料超過上限，僅載入最近的部分'); }
    catch (e) { notify('讀取點擊資料失敗：' + e.message); }
  }, [cloudUrl, cloudToken]);

  const connect = useCallback(async (u = cloudUrl, t = cloudToken) => {
    if (!u || !t) { setCloudState('off'); setCloudMsg(''); notify('請填入 Apps Script 網址與管理密碼'); return; }
    setCloudState('loading'); setCloudMsg('');
    try {
      const ping = await gas(u, { action: 'ping', token: t });
      if (!ping.ok) throw new Error(ping.error === 'unauthorized' ? '管理密碼不正確' : (ping.error || '連線失敗'));
      const all = await gas(u, { action: 'getAll', token: t });
      if (!all.ok) throw new Error(all.error || '讀取失敗');
      const cl = (all.links || []).map(fromCloud).reverse();                          // 新的在前
      const keys = new Set(cl.map((l) => slugKey(l.slug)));
      const merged = [...linksRef.current.filter((l) => !keys.has(slugKey(l.slug))), ...cl];
      const cp = all.presets || [];
      const pk = new Set(cp.map((p) => p.id));
      const mergedPresets = [...cp, ...presetsRef.current.filter((p) => !pk.has(p.id))];
      lastSig.current = sigOf(cl, cp);
      setLinks(merged); setPresets(mergedPresets);
      await reloadRows(u, t);
      loaded.current = true; setCloudState('ok'); setCloudMsg(ping.sheetUrl || '');
    } catch (e) { setCloudState('error'); setCloudMsg(e.message || '連線失敗'); }
  }, [cloudUrl, cloudToken, reloadRows]);

  const pushNow = useCallback(async (silent) => {
    try {
      const ls = linksRef.current, ps = presetsRef.current;
      const r = await gas(cloudUrl, { action: 'saveLinks', token: cloudToken, links: ls.map(toCloud), presets: ps.map(presetOut), allowEmpty: true });
      if (!r.ok) throw new Error(r.error || '儲存失敗');
      lastSig.current = sigOf(ls, ps);
      if (!silent) notify('已儲存到雲端（' + r.saved + ' 條）');
    } catch (e) { notify('雲端儲存失敗：' + e.message); }
  }, [cloudUrl, cloudToken]);

  useEffect(() => { if (REAL && cloudUrl && cloudToken) connect(); }, []);
  useEffect(() => {
    if (!REAL || cloudState !== 'ok' || !loaded.current || !autoSync) return;
    if (sigOf(links, presets) === lastSig.current) return;
    const h = setTimeout(() => pushNow(true), 900);
    return () => clearTimeout(h);
  }, [links, presets, cloudState, autoSync, pushNow]);

  useEffect(() => { const on = () => setTab(fromHash()); window.addEventListener('hashchange', on); return () => window.removeEventListener('hashchange', on); }, []);
  const go = (t) => { location.hash = t; setTab(t); window.scrollTo(0, 0); };
  const addLink = (l) => setLinks((ls) => [l, ...ls]);
  const openAnalytics = (id) => { setLinkId(id); go('analytics'); };
  const titles = {
    create: ['建立短網址', '組合 UTM、縮短網址、產生 QR Code'], links: ['連結管理', '搜尋、暫停與檢視所有短網址'],
    analytics: ['成效分析', '點擊、裝置、來源與地區'], domains: ['網域設定', REAL ? '使用自己的網域' : '綁定自訂品牌網域與 SSL 憑證'],
    cloud: ['雲端儲存', '把短網址與點擊紀錄存進你的 Google 雲端硬碟'],
  };

  return (
    <>
      <header className="topbar">
        <div className="wrap flex items-center gap-6 overflow-x-auto">
          <div className="flex items-center gap-2 py-3 flex-none">
            <span style={{ width: 26, height: 26, borderRadius: 7, background: 'var(--accent)', color: 'var(--accent-fg)', display: 'grid', placeItems: 'center' }}><Icon name="Link2" size={15} /></span>
            <span className="font-bold text-[16px] tracking-tight">{CFG.appName || 'Waypoint'}</span>
          </div>
          <nav className="flex" aria-label="主選單">
            {TABS.map(([k, ic, t]) => <button key={k} className="tab" aria-current={tab === k ? 'page' : undefined} onClick={() => go(k)}><Icon name={ic} size={16} />{t}</button>)}
          </nav>
        </div>
      </header>
      <main className="wrap" style={{ paddingTop: 24 }}>
        <div className="mb-5">
          <h1 className="text-2xl font-bold">{titles[tab][0]}</h1>
          <p className="text-[color:var(--muted)]">{titles[tab][1]}</p>
        </div>
        {tab === 'create' && <CreatePage domains={domains} links={links} presets={presets} setPresets={setPresets} addLink={addLink} notify={notify} />}
        {tab === 'links' && <LinksPage links={links} setLinks={setLinks} domains={domains} openAnalytics={openAnalytics} notify={notify} cloudRows={rows} />}
        {tab === 'analytics' && <AnalyticsPage links={links} linkId={linkId} setLinkId={setLinkId} cloudRows={rows} cloudState={cloudState} goCloud={() => go('cloud')} />}
        {tab === 'domains' && <DomainsPage domains={domains} setDomains={setDomains} links={links} notify={notify} />}
        {REAL && tab === 'cloud' && <CloudPage url={cloudUrl} setUrl={setCloudUrl} token={cloudToken} setToken={setCloudToken} state={cloudState} msg={cloudMsg} connect={connect} pushNow={pushNow} reloadRows={() => reloadRows()} autoSync={autoSync} setAutoSync={setAutoSync} links={links} rows={rows} notify={notify} />}
      </main>
      {toast && <div className="toast" role="status">{toast}</div>}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</html>
